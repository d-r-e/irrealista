<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <link rel="icon" type="image/png" href="/icons/icon32.png"/>
    <title>Irrealista</title>
    <script type="module" src="/src/options/index.ts"></script>
    <style>
      body{margin:0;background:#f6f7f6;color:#24312b;font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      main{max-width:980px;margin:36px auto;padding:0 24px 36px}
      h1{margin-bottom:4px;color:#173d31}h2{margin:0 0 12px;font-size:16px}p{color:#64736b}
      form{display:grid;gap:20px;margin-top:24px}section{padding:20px;border:1px solid #dde5e0;border-radius:12px;background:#fff;box-shadow:0 1px 3px #0000000d}
      .criteria-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.criterion-card{padding:14px;border:1px solid #e0e8e3;border-radius:8px;background:#fbfdfb}.criterion-heading{display:flex;gap:12px;justify-content:space-between}.criterion-card h3{margin:0;color:#28483b;font-size:14px}.criterion-card p{margin:3px 0 10px;font-size:12px}.switch{align-self:start;white-space:nowrap;color:#416154;font-size:12px;font-weight:650}.weight-input,.boolean-values label,.access-setting,.filter-setting,.routes-panel>label,.zone-values label{display:grid;gap:5px;color:#506158;font-size:12px;font-weight:650}.weight-input{width:100px}.boolean-values{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.zone-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:12px;color:#fff;font-size:10px;font-weight:750;text-align:center}.zone-legend span{padding:3px}.zone-positive{background:#248158}.zone-neutral{background:#a37a21}.zone-negative{background:#b6514a}.dual-range{position:relative;height:30px;margin:0 8px;background:linear-gradient(90deg,#b6514a 0 var(--negative-boundary),#a37a21 var(--negative-boundary) var(--positive-boundary),#248158 var(--positive-boundary) 100%);border-radius:5px}.dual-range.is-lower-better{background:linear-gradient(90deg,#248158 0 var(--positive-boundary),#a37a21 var(--positive-boundary) var(--negative-boundary),#b6514a var(--negative-boundary) 100%)}.dual-range input[type=range]{position:absolute;inset:0;width:100%;margin:0;appearance:none;background:transparent;pointer-events:none}.dual-range input[type=range]::-webkit-slider-thumb{width:17px;height:27px;appearance:none;border:2px solid #fff;border-radius:3px;background:#173d31;box-shadow:0 1px 3px #0006;cursor:ew-resize;pointer-events:auto}.zone-values{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.access-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.access-setting,.filter-setting{grid-template-columns:minmax(0,1fr) 84px;align-items:center;padding:10px;border:1px solid #e0e8e3;background:#fbfdfb}.access-setting small{display:block;margin-top:2px;color:#76867d;font-weight:500}.filter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.filter-setting span{font-weight:650}
      input{box-sizing:border-box;width:100%;min-height:36px;padding:7px 9px;border:1px solid #b7c6be;border-radius:6px;background:#fff;color:#24312b;font:inherit}
      .routes-panel{display:grid;gap:14px}.routes-panel p{margin:0;font-size:12px}button{margin-top:20px;border:0;border-radius:7px;background:#226747;color:#fff;padding:10px 14px;font:650 14px inherit;cursor:pointer}
      output{display:block;margin-top:10px;color:#226747;font-weight:650}@media(max-width:700px){.criteria-grid,.access-grid,.filter-grid{grid-template-columns:1fr}.curve-points{grid-template-columns:repeat(2,1fr)}main{margin-top:22px}}
    </style>
  </head>
  <body>
    <main>
      <h1>Irrealista</h1>
      <p>Personaliza el score y las rutas a pie al Metro de Madrid.</p>
      <form id="preferences-form"></form>
      <button id="save" type="button">Guardar preferencias</button>
      <output id="status" aria-live="polite"></output>
    </main>
  </body>
</html>

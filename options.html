<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <link rel="icon" type="image/png" href="/icons/icon32.png"/>
    <title>Irrealista</title>
    <script type="module" src="/src/options/index.ts"></script>
    <style>
      body{margin:0;background:#f6f7f6;color:#24312b;font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      main{max-width:980px;margin:36px auto;padding:0 24px 36px}
      h1{margin-bottom:4px;color:#173d31}h2{margin:0 0 12px;font-size:16px}p{color:#64736b}
      form{display:grid;gap:20px;margin-top:24px}section{padding:20px;border:1px solid #dde5e0;border-radius:12px;background:#fff;box-shadow:0 1px 3px #0000000d}
      .criteria-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.criterion-card{padding:16px;border:1px solid #dbe6e0;border-radius:10px;background:linear-gradient(180deg,#fff,#f9fcfa);box-shadow:0 1px 2px #173d3108}.criterion-heading{display:flex;gap:12px;justify-content:space-between}.criterion-card h3{margin:0;color:#28483b;font-size:14px}.criterion-card p{margin:3px 0 10px;font-size:12px}.switch{align-self:start;white-space:nowrap;color:#416154;font-size:12px;font-weight:650}.weight-input,.boolean-values label,.access-setting,.filter-setting,.routes-panel>label,.zone-values label{display:grid;gap:5px;color:#506158;font-size:12px;font-weight:650}.criterion-controls{display:flex;align-items:end;justify-content:space-between;gap:12px}.weight-input{width:92px}.direction-badge{margin-bottom:8px;padding:4px 7px;border:1px solid #d9e5df;border-radius:99px;background:#f2f7f4;color:#527064;font-size:10px;font-weight:750}.boolean-values{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.zone-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:14px;color:#fff;font-size:10px;font-weight:750;text-align:center}.zone-legend span{padding:4px 3px}.zone-legend span:first-child{border-radius:4px 0 0 4px}.zone-legend span:last-child{border-radius:0 4px 4px 0}.zone-positive{background:#248158}.zone-neutral{background:#a37a21}.zone-negative{background:#b6514a}.dual-range{position:relative;height:36px;margin:2px 10px}.range-track{position:absolute;top:14px;right:0;left:0;height:10px;border:1px solid #ffffffcc;border-radius:99px;background:linear-gradient(90deg,#b6514a 0 var(--negative-boundary),#c3942f var(--negative-boundary) var(--positive-boundary),#248158 var(--positive-boundary) 100%);box-shadow:0 0 0 1px #244d3b1f,inset 0 1px 2px #0002}.dual-range.is-lower-better .range-track{background:linear-gradient(90deg,#248158 0 var(--positive-boundary),#c3942f var(--positive-boundary) var(--negative-boundary),#b6514a var(--negative-boundary) 100%)}.dual-range input[type=range]{position:absolute;inset:0;width:100%;margin:0;appearance:none;background:transparent;outline:0;pointer-events:none}.dual-range input[type=range]::-webkit-slider-runnable-track{height:10px;background:transparent}.dual-range input[type=range]::-webkit-slider-thumb{width:18px;height:28px;margin-top:-9px;appearance:none;border:3px solid #fff;border-radius:5px;background:#173d31;box-shadow:0 0 0 1px #173d31,0 2px 5px #173d3159;cursor:ew-resize;pointer-events:auto;transition:transform .12s ease,box-shadow .12s ease}.dual-range input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.08);box-shadow:0 0 0 2px #75b99a,0 3px 7px #173d3166}.dual-range input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px #aad7c2,0 3px 7px #173d3166}.range-scale{display:flex;justify-content:space-between;margin:-4px 8px 0;color:#87958e;font-size:9px}.zone-values{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.zone-values label{position:relative;padding:8px 8px 8px 25px;border:1px solid #e1e9e4;border-radius:6px;background:#fff}.value-dot{position:absolute;top:11px;left:9px;width:8px;height:8px;border-radius:50%}.value-dot--positive{background:#248158}.value-dot--negative{background:#b6514a}.zone-values input{margin-top:2px;font-weight:700}.access-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.access-setting,.filter-setting{grid-template-columns:minmax(0,1fr) 84px;align-items:center;padding:10px;border:1px solid #e0e8e3;background:#fbfdfb}.access-setting small{display:block;margin-top:2px;color:#76867d;font-weight:500}.filter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.filter-setting span{font-weight:650}
      input{box-sizing:border-box;width:100%;min-height:36px;padding:7px 9px;border:1px solid #b7c6be;border-radius:6px;background:#fff;color:#24312b;font:inherit}
      .routes-panel{display:grid;gap:14px}.routes-panel p{margin:0;font-size:12px}button{margin-top:20px;border:0;border-radius:7px;background:#226747;color:#fff;padding:10px 14px;font:650 14px inherit;cursor:pointer}
      output{display:block;margin-top:10px;color:#226747;font-weight:650}@media(max-width:700px){.criteria-grid,.access-grid,.filter-grid{grid-template-columns:1fr}.curve-points{grid-template-columns:repeat(2,1fr)}main{margin-top:22px}}
    </style>
  </head>
  <body>
    <main>
      <h1>Irrealista</h1>
      <p>Personaliza el score y las rutas a pie al Metro de Madrid.</p>
      <form id="preferences-form"></form>
      <button id="save" type="button">Guardar preferencias</button>
      <output id="status" aria-live="polite"></output>
    </main>
  </body>
</html>
